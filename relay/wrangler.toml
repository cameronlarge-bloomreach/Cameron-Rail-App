# Cloudflare Worker settings for the Right Time relay.
# Lets Cloudflare build and deploy the relay straight from GitHub
# (Workers & Pages → Create application → Import a repository),
# with "relay" as the root directory. No code copying needed.
name = "right-time-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

# The Realtime Trains token is NOT stored here. Add it in the Cloudflare
# dashboard: Worker → Settings → Variables and Secrets → Secret
#   RTT_REFRESH_TOKEN  (or RTT_ACCESS_TOKEN)
